<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docs</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0 auto; max-width: 52rem; padding: 1rem; }
  h1 { font-size: 1.2rem; }
  fieldset { border: 1px solid #8884; border-radius: 6px; margin-bottom: 1rem; }
  input, button { font: inherit; padding: .35rem .5rem; margin: .15rem 0; }
  ul#doclist { list-style: none; padding: 0; }
  ul#doclist li { display: flex; gap: .5rem; align-items: baseline; padding: .25rem 0; }
  ul#doclist a { flex: 1; }
  .err { color: #c33; }
  .hidden { display: none !important; }
  #connstatus, #presence { font-size: .85rem; opacity: .7; margin-left: .5rem; }

  /* editor chrome */
  #toolbar { display: flex; gap: .25rem; margin: .5rem 0; flex-wrap: wrap; }
  #toolbar button { min-width: 2.2rem; padding: .25rem .4rem; border: 1px solid #8884;
                    border-radius: 4px; background: transparent; cursor: pointer; }
  #toolbar button:hover { background: #8882; }
  .cm-editor { border: 1px solid #8884; border-radius: 6px; height: 72vh;
               font-size: 1rem; }
  .cm-editor.cm-focused { outline: none; border-color: #888a; }
  .cm-scroller { line-height: 1.6; font-family: inherit; }
  .cm-content { padding: 1rem; }

  /* live preview styling — classes attached by editor.js decorations */
  .md-strong { font-weight: 700; }
  .md-em { font-style: italic; }
  .md-strike { text-decoration: line-through; }
  .md-code { font-family: ui-monospace, monospace; font-size: .9em;
             background: #8882; border-radius: 3px; padding: 0 .2em; }
  .md-link { color: #4a8fdd; text-decoration: underline; }
  .md-dim { opacity: .45; }
  .md-heading { font-weight: 700; }
  .md-h1 { font-size: 1.7em; }
  .md-h2 { font-size: 1.4em; }
  .md-h3 { font-size: 1.2em; }
  .md-h4, .md-h5, .md-h6 { font-size: 1.05em; }
  .md-blockquote { border-left: 3px solid #8886; padding-left: .6rem; opacity: .85; }
  .md-codeblock { font-family: ui-monospace, monospace; font-size: .9em; background: #8881; }

  /* remote cursors (y-codemirror.next) */
  .cm-ySelection { }
  .cm-ySelectionCaret { position: relative; border-left: 1px solid; margin-left: -1px; }
  .cm-ySelectionCaretDot { border-radius: 50%; position: absolute; width: .4em; height: .4em;
                           top: -.2em; left: -.2em; background: inherit; }
  .cm-ySelectionInfo { position: absolute; top: -1.4em; left: -1px; font-size: .7em;
                       font-family: system-ui, sans-serif; font-style: normal; font-weight: normal;
                       line-height: normal; user-select: none; color: #000; padding: 0 .3em;
                       border-radius: 3px; white-space: nowrap; opacity: 0; transition: opacity .3s; }
  .cm-ySelectionCaret:hover > .cm-ySelectionInfo { opacity: 1; }
</style>
</head>
<body>
<h1>docs</h1>

<div id="authview" class="hidden">
  <fieldset>
    <legend>Sign in</legend>
    <form id="loginform">
      <input name="email" type="email" placeholder="email" required>
      <input name="password" type="password" placeholder="password" required>
      <button>Sign in</button>
    </form>
  </fieldset>
  <fieldset>
    <legend>Sign up</legend>
    <form id="signupform">
      <input name="name" placeholder="name" required>
      <input name="email" type="email" placeholder="email" required>
      <input name="password" type="password" placeholder="password (min 8)" required>
      <button>Create account</button>
    </form>
  </fieldset>
  <p id="autherr" class="err"></p>
</div>

<div id="listview" class="hidden">
  <p>Signed in as <span id="who"></span> — <a href="#" id="logout">sign out</a></p>
  <form id="createform">
    <input name="title" placeholder="new document title">
    <button>Create</button>
  </form>
  <ul id="doclist"></ul>
</div>

<div id="editorview" class="hidden">
  <p><a href="#" id="back">← documents</a> <strong id="doctitle"></strong>
     <a href="#" id="sharebtn" class="hidden">share</a>
     <span id="connstatus"></span><span id="presence"></span></p>
  <div id="toolbar"></div>
  <div id="editor"></div>
</div>

<div id="shareview" class="hidden">
  <p><a href="#" id="shareback">← back</a> Sharing <strong id="sharetitle"></strong></p>
  <fieldset>
    <legend>People</legend>
    <ul id="sharelist"></ul>
    <form id="shareform">
      <input name="email" type="email" placeholder="email of existing account" required>
      <select name="role"><option value="editor">editor</option><option value="viewer">viewer</option></select>
      <button>Add</button>
    </form>
    <p id="shareerr" class="err"></p>
  </fieldset>
  <fieldset>
    <legend>Share links</legend>
    <ul id="linklist"></ul>
    <p>
      <button id="mklink-viewer">New viewer link</button>
      <button id="mklink-editor">New editor link</button>
    </p>
    <p id="newlink" class="hidden">Copy it now — it is shown only once:<br>
      <input id="newlinkurl" readonly size="50"> <button id="copylink">copy</button></p>
  </fieldset>
</div>

<script src="/app.js"></script>
</body>
</html>
