# The website: static files from site/, nothing else.
#
# Every response is `no-cache`: stored, but revalidated on each load, so a
# deploy is seen on the next navigation rather than after whatever lifetime
# the browser would guess from Last-Modified. nginx sends an ETag for a file
# it serves from disk, so the revalidation is a 304 and costs one round trip.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }
}
