# The website: static files from site/, nothing else.
#
# nitro sends `Cache-Control: no-cache` on every file, which is what this
# site needs: stored, but revalidated on each load, so a deploy is seen on
# the next navigation rather than after whatever lifetime the browser would
# guess from Last-Modified. nitro sends Last-Modified for every file, so the
# revalidation is a 304 and costs one round trip.

listen :8080
log stdout

# The proxy in front reaches this container through the published port, so
# the TCP peer is a Docker bridge address. Trusting the Docker private range
# lets the access log show the client from X-Forwarded-For instead.
trusted-proxies 172.16.0.0/12

# The name is a label only: a config with one site answers every host.
site owndocs {
    root /srv/site
}
